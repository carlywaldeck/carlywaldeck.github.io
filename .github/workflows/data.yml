# Refreshes the open data behind Weekender (climate, crowds, prices, OpenStreetMap, Wikipedia)
# and embeds it into index.html. Runs monthly, when the data scripts change, or by hand
# (Actions tab → "Refresh city data" → Run workflow).
name: Refresh city data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these city ids, comma-separated (blank = all)"
        required: false
      skip:
        description: "Skip sources: wikipedia,climate,crowds,prices,osm (blank = none)"
        required: false
  schedule:
    - cron: "17 4 2 * *" # 04:17 UTC on the 2nd of each month
  push:
    branches: [main]
    paths:
      - "scripts/build-data.mjs"
      - "scripts/embed-data.mjs"
      - "data/cities-meta.json"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: city-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch open data
        continue-on-error: true # keep whatever was fetched, even if some sources failed
        env:
          TIME_BUDGET_MIN: "145"
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.inputs.skip }}
        run: node scripts/build-data.mjs
      - name: Save and commit the new data on top of the latest main
        run: |
          # Keep this run's data files and re-embed them into the newest index.html, so a data run
          # never conflicts with commits pushed while it was running. Retries if main moves again.
          mkdir -p /tmp/newdata && cp data/city-data.json data/REPORT.md /tmp/newdata/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/newdata/city-data.json /tmp/newdata/REPORT.md data/
            node scripts/embed-data.mjs
            git add data/city-data.json data/REPORT.md index.html
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Refresh city data from open sources"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "main moved; retrying ($attempt)"; sleep 5
          done
          exit 1
