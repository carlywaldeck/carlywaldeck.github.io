# Refreshes the open data behind Weekender (climate, crowds, prices, OpenStreetMap, Wikipedia)
# and writes it to data/app-data.js. Runs monthly, when the data scripts change, or by hand
# (Actions tab → "Refresh city data" → Run workflow).
name: Refresh city data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these city ids, comma-separated (blank = all)"
        required: false
      skip:
        description: "Skip sources: wikipedia,climate,crowds,prices,fares,roads,coast,osm (blank = none)"
        required: false
  schedule:
    - cron: "17 4 2 * *" # 04:17 UTC on the 2nd of each month: everything
    - cron: "23 5 * * 1" # 05:23 UTC every Monday: flight fares only (they change weekly)
  push:
    branches: [main]
    paths:
      - "scripts/build-data.mjs"
      - "scripts/embed-data.mjs"
      - "data/cities-meta.json"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: city-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch open data
        continue-on-error: true # keep whatever was fetched, even if some sources failed
        env:
          TIME_BUDGET_MIN: "145"
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.schedule == '23 5 * * 1' && 'wikipedia,climate,crowds,prices,roads,coast,osm' || github.event.inputs.skip }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/build-data.mjs
      - name: Install the browser for the city pages
        run: npm ci && npx playwright install --with-deps chromium
      - name: Save and commit the new data on top of the latest main
        run: |
          # Keep this run's data files and rewrite data/app-data.js on top of the newest main, so a data run
          # never conflicts with commits pushed while it was running. Retries if main moves again.
          mkdir -p /tmp/newdata && cp data/city-data.json data/REPORT.md /tmp/newdata/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Always save to main: that's what the live site is built from, whichever branch ran this.
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/newdata/city-data.json /tmp/newdata/REPORT.md data/
            node scripts/embed-data.mjs
            node scripts/build-pages.mjs || echo "city pages not rebuilt"
            git add data/city-data.json data/app-data.js data/fare-details.js data/REPORT.md index.html from sitemap.xml robots.txt
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Refresh city data from open sources"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; retrying ($attempt)"; sleep 5
          done
          exit 1
      - name: Email price alerts for saved trips that got cheaper
        continue-on-error: true # never fail the data refresh over emails
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/price-alerts.mjs
