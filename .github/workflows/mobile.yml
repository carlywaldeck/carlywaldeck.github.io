# Builds the phone apps from the website (mobile/, Capacitor):
#  - Android: a debug APK you can install on an Android phone (download it from the run's Artifacts).
#  - iOS: compiles the app for the simulator, to catch problems before building in Xcode.
# Runs when the app or the site changes, or by hand (Actions → Build phone apps → Run workflow).
name: Build phone apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "index.html"
      - "assets/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install (site for d3, app for Capacitor)
        run: npm ci && cd mobile && npm ci
      - name: Copy the site into the app and sync Android
        run: cd mobile && npm run build && npx cap sync android
      - name: Build the debug APK
        run: cd mobile/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: weekender-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (site for d3, app for Capacitor)
        run: npm ci && cd mobile && npm ci
      - name: Copy the site into the app and sync iOS (installs CocoaPods)
        run: cd mobile && npm run build && npx cap sync ios
      - name: Compile for the iOS simulator (no signing needed)
        run: |
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
