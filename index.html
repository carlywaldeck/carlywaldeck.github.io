// ---------------------------------------------------------------- globe
// A 3D orthographic globe drawn on canvas with d3-geo. Country outlines: Natural Earth
// (public domain). Arcs are drawn at altitude so they lift off the surface.

const G = {
  ok: false, rot: [-10, -30], scale: 300, busy: false, dirty: true, fitKey: "",
  W: 0, H: 0, dpr: 1, cx: 0, cy: 0, markers: [], start: performance.now(), dragging: false
};
let projection, baseCtx, fxCtx, pathFast, pathDetail, fxPath, graticule;
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const TONE_COLORS = { good: "#12A594", mid: "#EFA21C", warn: "#E8527A" };
const LABEL_COLORS = { good: "#0B8A7C", mid: "#B7770A", warn: "#C73558" };
const globeDirty = () => { G.dirty = true; };

function globeInit() {
  if (typeof d3 === "undefined" || !window.GEO) {
    document.body.classList.add("no-globe");
    return;
  }
  G.ok = true;
  const base = $("#globe-base"), fx = $("#globe-fx");
  baseCtx = base.getContext("2d");
  fxCtx = fx.getContext("2d");
  projection = d3.geoOrthographic().clipAngle(90).precision(0.4);
  pathFast = d3.geoPath(projection, baseCtx);
  pathDetail = d3.geoPath(projection, baseCtx);
  fxPath = d3.geoPath(projection, fxCtx);
  graticule = d3.geoGraticule10();
  globeResize();
  window.addEventListener("resize", () => { globeResize(); fitGlobe(false); });

  // Drag to spin, scroll to zoom, hover and click markers.
  let drag = null;
  fx.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, rot: [...G.rot], moved: false };
    fx.setPointerCapture(e.pointerId);
  });
  fx.addEventListener("pointermove", (e) => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; G.dragging = true; fx.classList.add("grabbing"); }
      if (drag.moved) {
        const k = 57.3 / G.scale;
        G.rot = [drag.rot[0] + dx * k, Math.max(-85, Math.min(85, drag.rot[1] - dy * k))];
        G.anim = null; globeDirty();
      }
      return;
    }
    const hit = hitTest(e);
    if (hit !== ui.hover) {
      ui.hover = hit; G.fxDirty = true;
      fx.style.cursor = hit ? "pointer" : "";
      document.querySelectorAll(".row").forEach(r => r.classList.toggle("hover", r.dataset.id === hit));
    }
  });
  fx.addEventListener("pointerup", (e) => {
    const moved = drag && drag.moved;
    drag = null; G.dragging = false; fx.classList.remove("grabbing"); globeDirty();
    if (moved) return;
    const hit = hitTest(e);
    if (hit) select(hit);
  });
  fx.addEventListener("pointerleave", () => { ui.hover = null; G.fxDirty = true; });
  fx.addEventListener("wheel", (e) => {
    e.preventDefault();
    G.anim = null;
    G.scale = clampScale(G.scale * Math.exp(-e.deltaY * 0.0016));
    globeDirty();
  }, { passive: false });
  $("#zoom-in").addEventListener("click", () => zoomBy(1.6));
  $("#zoom-out").addEventListener("click", () => zoomBy(1 / 1.6));
  $("#zoom-fit").addEventListener("click", () => fitGlobe(true));
  $("#zoom-earth").addEventListener("click", () => flyTo([G.rot[0], -20], globeFullScale()));

  drawStars();
  requestAnimationFrame(frame);
}

function globeResize() {
  const stage = $("#stage");
  G.W = stage.clientWidth; G.H = stage.clientHeight;
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [$("#globe-base"), $("#globe-fx"), $("#stars")]) {
    c.width = G.W * G.dpr; c.height = G.H * G.dpr;
    c.style.width = G.W + "px"; c.style.height = G.H + "px";
  }
  // Keep the globe centered in the space not covered by the trip panel.
  const mobile = G.W < 760;
  const panelW = mobile ? 0 : Math.min(400, G.W * 0.34) + 24;
  const topH = mobile ? 70 : 90, sheetH = mobile ? G.H * 0.42 : 0;
  G.cx = (G.W - panelW) / 2;
  G.cy = topH + (G.H - topH - sheetH) / 2;
  G.availR = Math.min(G.W - panelW - 40, G.H - topH - sheetH - 40) / 2;
  drawStars();
  globeDirty();
}

const globeFullScale = () => G.availR * 0.92;
const clampScale = (s) => Math.max(globeFullScale() * 0.5, Math.min(s, globeFullScale() * 90));
function zoomBy(f) { flyTo(G.rot, clampScale(G.scale * f), 500); }

function drawStars() {
  // Plain light background with a faint lift behind the globe.
  const c = $("#stars"), ctx = c.getContext("2d");
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.fillStyle = "#F3F6FA";
  ctx.fillRect(0, 0, G.W, G.H);
  const lift = ctx.createRadialGradient(G.cx, G.cy, 0, G.cx, G.cy, Math.max(G.W, G.H) * 0.6);
  lift.addColorStop(0, "rgba(255,255,255,0.9)");
  lift.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = lift;
  ctx.fillRect(0, 0, G.W, G.H);
}

// ---- camera

function flyTo(rot, scale, dur) {
  if (!G.ok) return;
  const from = { rot: [...G.rot], scale: G.scale };
  // take the short way round
  let dLon = ((rot[0] - from.rot[0] + 540) % 360) - 180;
  const to = { rot: [from.rot[0] + dLon, rot[1]], scale: clampScale(scale) };
  const dist = Math.hypot(dLon, rot[1] - from.rot[1]);
  const duration = reduceMotion ? 0 : (dur ?? Math.min(2600, 900 + dist * 14 + Math.abs(Math.log(to.scale / from.scale)) * 260));
  // Earth-zoom: pull back toward space in the middle of long moves, then dive in.
  const pull = Math.min(1.6, dist / 45) * (to.scale > globeFullScale() * 1.5 || from.scale > globeFullScale() * 1.5 ? 1 : 0.3);
  G.anim = { from, to, t0: performance.now(), duration, pull };
  globeDirty();
}

function stepAnim(now) {
  const a = G.anim;
  if (!a) return false;
  const t = a.duration ? Math.min(1, (now - a.t0) / a.duration) : 1;
  const e = d3.easeCubicInOut(t);
  G.rot = [a.from.rot[0] + (a.to.rot[0] - a.from.rot[0]) * e, a.from.rot[1] + (a.to.rot[1] - a.from.rot[1]) * e];
  const logS = Math.log(a.from.scale) * (1 - e) + Math.log(a.to.scale) * e - a.pull * Math.sin(Math.PI * e);
  G.scale = Math.max(globeFullScale() * 0.45, Math.exp(logS));
  if (t >= 1) G.anim = null;
  return true;
}

// Frame the host city and its trips (nearby escapes on short trips).
function frameTarget() {
  const home = current.home;
  const trips = current.trips.filter(t => !t.over);
  const near = trips.filter(isEscape);
  const pick = near.length ? [...near, ...trips.filter(t => !isEscape(t)).slice(0, 3)] : trips.slice(0, 16);
  const pts = [[home.lon, home.lat], ...pick.flatMap(tripPoints)];
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const center = [(Math.min(...lons) + Math.max(...lons)) / 2, (Math.min(...lats) + Math.max(...lats)) / 2];
  const maxAng = Math.max(0.012, ...pts.map(p => d3.geoDistance(center, p)));
  const scale = Math.min(globeFullScale() * 90, (G.availR * 0.86) / Math.sin(Math.min(maxAng, 1.4)));
  return { rot: [-center[0], -center[1]], scale };
}

function fitGlobe(animate) {
  if (!G.ok || !current.home) return;
  const f = frameTarget();
  if (animate) flyTo(f.rot, f.scale);
  else { G.rot = f.rot; G.scale = clampScale(f.scale); globeDirty(); }
}

function globeFlyToTrip(t) {
  const home = current.home;
  const pts = [[home.lon, home.lat], ...tripPoints(t)];
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const center = [(Math.min(...lons) + Math.max(...lons)) / 2, (Math.min(...lats) + Math.max(...lats)) / 2];
  const maxAng = Math.max(0.01, ...pts.map(p => d3.geoDistance(center, p)));
  flyTo([-center[0], -center[1]], (G.availR * 0.7) / Math.sin(Math.min(maxAng, 1.4)));
}

function globeUpdate() {
  if (!G.ok) return;
  const key = [state.home, [...state.daysSet].join(), state.month, state.budget, [...state.modes].join(), [...state.interests].join()].join("|");
  if (key !== G.fitKey) {
    const first = !G.fitKey;
    G.fitKey = key;
    if (first && !reduceMotion) {
      // Intro: start out in space, then fly in to the host city.
      const f = frameTarget();
      G.rot = [f.rot[0] + 70, -15]; G.scale = globeFullScale() * 0.75;
      flyTo(f.rot, f.scale, 2600);
    } else fitGlobe(true);
  }
  globeDirty();
}

// ---- drawing

function visible(p) {
  return d3.geoDistance(p, [-G.rot[0], -G.rot[1]]) < Math.PI / 2 - 0.02;
}

// Land dots as unit vectors (Natural Earth land sampled on a Fibonacci spiral, ~0.75° apart), built once.
let DOTS = null;
function landDots() {
  if (DOTS) return DOTS;
  const n = LAND_DOTS.length / 2;
  DOTS = { n, x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n) };
  for (let i = 0; i < n; i++) {
    const lon = LAND_DOTS[2 * i] / 10 * Math.PI / 180, lat = LAND_DOTS[2 * i + 1] / 10 * Math.PI / 180;
    DOTS.x[i] = Math.cos(lat) * Math.cos(lon);
    DOTS.y[i] = Math.cos(lat) * Math.sin(lon);
    DOTS.z[i] = Math.sin(lat);
  }
  return DOTS;
}

// How far we've zoomed from "whole globe" (1) toward a regional map; 0 = dots, 1 = detailed map.
function mapBlend() {
  const k = G.scale / globeFullScale();
  return Math.max(0, Math.min(1, (k - 1.6) / 1.0));
}

function drawBase() {
  const ctx = baseCtx, { W, H, dpr } = G;
  const moving = !!G.anim || G.dragging;
  projection.rotate([G.rot[0], G.rot[1]]).scale(G.scale).translate([G.cx, G.cy]);
  const r = G.scale;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Sphere with a soft drop shadow
  if (r < Math.max(W, H)) {
    const sh = ctx.createRadialGradient(G.cx, G.cy + r * 0.06, r * 0.9, G.cx, G.cy + r * 0.06, r * 1.12);
    sh.addColorStop(0, "rgba(30,60,110,0.13)");
    sh.addColorStop(1, "rgba(30,60,110,0)");
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.arc(G.cx, G.cy + r * 0.06, r * 1.12, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#E7EDF5";
  ctx.beginPath(); ctx.arc(G.cx, G.cy, r, 0, 7); ctx.fill();

  const blend = mapBlend();

  // Faint graticule on the zoomed-out globe
  if (blend < 1) {
    ctx.beginPath(); pathFast(graticule);
    ctx.strokeStyle = `rgba(19,35,63,${0.05 * (1 - blend)})`; ctx.lineWidth = 0.6; ctx.stroke();
  }

  // Detailed map, fading in as you zoom
  if (blend > 0) {
    ctx.save();
    ctx.globalAlpha = blend;
    ctx.beginPath(); (moving ? pathFast : pathDetail)(moving ? GEO.land110 : GEO.land50);
    ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.strokeStyle = "rgba(19,35,63,0.28)"; ctx.lineWidth = 0.8; ctx.stroke();
    if (!moving) {
      ctx.beginPath(); pathDetail(GEO.borders50);
      ctx.strokeStyle = "rgba(19,35,63,0.14)"; ctx.lineWidth = 0.6; ctx.stroke();
    }
    ctx.restore();
  }

  // Dot-matrix land, fading out as you zoom. Orthographic projection done by hand for speed:
  // rotate by longitude, then tilt by latitude; depth > 0 means the dot faces us.
  if (blend < 1) {
    const d = landDots();
    const lam = G.rot[0] * Math.PI / 180, phi = G.rot[1] * Math.PI / 180;
    const cl = Math.cos(lam), sl = Math.sin(lam), cp = Math.cos(phi), sp = Math.sin(phi);
    const spacing = r * 0.75 * Math.PI / 180;
    const rad = Math.max(0.7, Math.min(2.4, spacing * 0.3));
    const buckets = [[], [], [], []];
    for (let i = 0; i < d.n; i++) {
      const x0 = d.x[i] * cl - d.y[i] * sl, y0 = d.x[i] * sl + d.y[i] * cl, z0 = d.z[i];
      const depth = x0 * cp - z0 * sp;
      if (depth <= 0.1) continue; // skip the squashed rows right at the rim
      const sx = G.cx + r * y0, sy = G.cy - r * (z0 * cp + x0 * sp);
      if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;
      buckets[Math.min(3, Math.floor(depth * 4))].push(sx, sy);
    }
    const base = 1 - blend;
    buckets.forEach((pts, b) => {
      if (!pts.length) return;
      ctx.fillStyle = `rgba(30,51,84,${[0.1, 0.32, 0.5, 0.66][b] * base})`;
      if (moving) {
        const s = rad * 1.8;
        for (let j = 0; j < pts.length; j += 2) ctx.fillRect(pts[j] - s / 2, pts[j + 1] - s / 2, s, s);
      } else {
        ctx.beginPath();
        for (let j = 0; j < pts.length; j += 2) { ctx.moveTo(pts[j] + rad, pts[j + 1]); ctx.arc(pts[j], pts[j + 1], rad, 0, 6.2832); }
        ctx.fill();
      }
    });
  }

  // Crisp rim
  ctx.strokeStyle = "rgba(19,35,63,0.10)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(G.cx, G.cy, r, 0, 7); ctx.stroke();
}

// A great-circle arc lifted off the surface: orthographic projection of a point at
// altitude h is just the surface point pushed outward from the globe center by (1 + h).
function arcPoints(a, b, alt) {
  const interp = d3.geoInterpolate(a, b);
  const n = 48, out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = interp(t);
    if (!visible(p)) { out.push(null); continue; }
    const [x, y] = projection(p);
    const h = 1 + alt * Math.sin(Math.PI * t);
    out.push([G.cx + (x - G.cx) * h, G.cy + (y - G.cy) * h]);
  }
  return out;
}

function strokeSegments(ctx, pts) {
  ctx.beginPath();
  let pen = false;
  for (const p of pts) {
    if (!p) { pen = false; continue; }
    if (pen) ctx.lineTo(p[0], p[1]); else { ctx.moveTo(p[0], p[1]); pen = true; }
  }
  ctx.stroke();
}

function drawFx() {
  const ctx = fxCtx, { W, H, dpr } = G;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!current.home) return;
  const home = current.home, homeP = [home.lon, home.lat];
  const focusKey = ui.hover || ui.selected;
  const focusTrip = focusKey ? tripById(focusKey) : null;
  // One marker per place: when a place appears for several trip lengths, show the highlighted
  // version if there is one, otherwise the first (best-ranked) one.
  const slot = new Map(), trips = [];
  current.trips.forEach(t => { if (!slot.has(t.dest.id)) { slot.set(t.dest.id, trips.length); trips.push(t); } });
  if (focusTrip) trips[slot.get(focusTrip.dest.id)] = focusTrip;
  const isFocusT = (t) => focusTrip && t === focusTrip;

  // Routes (static): top 10 plus whatever is highlighted.
  trips.forEach((t, i) => {
    const isFocus = isFocusT(t);
    if (i >= 10 && !isFocus) return;
    const pts = tripPoints(t);
    if (!pts.length) return;
    const mode = t.cost.transport.mode;
    const chain = [homeP, ...pts];
    ctx.save();
    ctx.strokeStyle = isFocus ? "#FF6A4D" : "#1E3354";
    ctx.globalAlpha = isFocus ? 1 : focusTrip ? 0.12 : 0.32;
    ctx.lineWidth = isFocus ? 2 : 1.1;
    ctx.setLineDash(mode === "bus" ? [1.5, 4] : mode === "train" ? [] : [5, 5]);
    for (let s = 0; s < chain.length - 1; s++) {
      const dist = d3.geoDistance(chain[s], chain[s + 1]);
      const alt = mode === "flight" ? Math.min(0.28, 0.08 + dist * 0.55) : Math.min(0.05, dist * 0.35);
      strokeSegments(ctx, arcPoints(chain[s], chain[s + 1], alt));
    }
    ctx.restore();
  });

  // Markers
  G.markers = [];
  const labels = [];
  [...trips].reverse().forEach((t) => {
    const i = trips.indexOf(t);
    const pts = tripPoints(t);
    if (!pts.length) return;
    const main = pts[pts.length - 1];
    if (!visible(main)) return;
    const [x, y] = projection(main);
    const isFocus = isFocusT(t);
    const col = TONE_COLORS[tone(t)];
    pts.slice(0, -1).forEach(p => { if (visible(p)) { const [sx, sy] = projection(p);
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 7); ctx.stroke(); } });
    const r = isFocus ? 6 : i < 10 ? 4.2 : 3;
    ctx.save();
    ctx.fillStyle = col; ctx.globalAlpha = (t.over || t.other) && !isFocus ? 0.55 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
    if (isFocus) { ctx.strokeStyle = "#13233F"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.stroke(); }
    G.markers.push({ id: t.key, x, y });
    if (i < 6 || isFocus) labels.push({ t, x, y, isFocus, i });
  });

  // Home (static ring)
  if (visible(homeP)) {
    const [hx, hy] = projection(homeP);
    ctx.strokeStyle = "rgba(19,35,63,0.35)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(hx, hy, 11, 0, 7); ctx.stroke();
    ctx.fillStyle = "#13233F"; ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.stroke();
    labels.push({ home: true, x: hx, y: hy });
  }

  // Labels with simple collision avoidance (home and the highlighted trip win).
  const placed = [];
  labels.sort((a, b) => (b.home ? 2 : b.isFocus ? 1 : 0) - (a.home ? 2 : a.isFocus ? 1 : 0) || (a.i ?? 0) - (b.i ?? 0));
  ctx.textBaseline = "middle";
  for (const l of labels) {
    const name = l.home ? home.name : l.t.dest.name;
    const price = l.home ? "" : euro(l.t.cost.total);
    ctx.font = `600 ${l.home ? 13 : 12}px Geist, system-ui, sans-serif`;
    const w1 = ctx.measureText(name).width;
    ctx.font = "500 12px 'Geist Mono', ui-monospace, monospace";
    const w2 = price ? ctx.measureText(price).width + 8 : 0;
    const bx = l.x + 11, by = l.y - 9, bw = w1 + w2 + 14, bh = 20;
    const box = [bx, by, bx + bw, by + bh];
    if (!l.home && !l.isFocus && placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
    placed.push(box);
    ctx.fillStyle = l.isFocus || l.home ? "rgba(255,255,255,0.97)" : "rgba(255,255,255,0.85)";
    ctx.shadowColor = "rgba(20,40,80,0.12)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    roundRect(ctx, bx, by, bw, bh, 6); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.font = `600 ${l.home ? 13 : 12}px Geist, system-ui, sans-serif`;
    ctx.fillStyle = "#13233F"; ctx.fillText(name, bx + 7, l.y + 1);
    if (price) { ctx.font = "500 12px 'Geist Mono', ui-monospace, monospace"; ctx.fillStyle = LABEL_COLORS[tone(l.t)]; ctx.fillText(price, bx + 7 + w1 + 8, l.y + 1); }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function hitTest(e) {
  const rect = $("#globe-fx").getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bd = 14;
  for (const m of G.markers) { const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m.id; } }
  return best;
}

// Redraw only when something changed (nothing on the globe animates by itself any more).
function frame(now) {
  const animating = stepAnim(now);
  const baseChanged = animating || G.dirty;
  if (baseChanged) { drawBase(); G.dirty = false; }
  if (baseChanged || G.fxDirty) {
    projection.rotate([G.rot[0], G.rot[1]]).scale(G.scale).translate([G.cx, G.cy]);
    drawFx();
    G.fxDirty = false;
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- controls

function update() {
  $("#budget-out").textContent = euro(state.budget);
  $("#month").value = String(state.month);
  document.querySelectorAll("#days .pick").forEach(b => b.setAttribute("aria-pressed", state.daysSet.has(Number(b.dataset.v))));
  document.querySelectorAll("#interests .chip").forEach(b => b.setAttribute("aria-pressed", state.interests.has(b.dataset.v)));
  document.querySelectorAll("#modes .chip").forEach(b => b.setAttribute("aria-pressed", state.modes.has(b.dataset.v)));
  document.querySelectorAll(".sort .pick").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.sort));
  const hidden = Object.keys(MODES).length - state.modes.size;
  $("#filters-count").textContent = hidden ? `${state.modes.size}/4` : "";
  $("#int-count").textContent = state.interests.size ? `${state.interests.size} picked` : "Pick any to rank trips by what you like";
  const result = findTrips();
  current = { home: result.home, trips: orderedTrips(result) };
  if (ui.selected && !tripById(ui.selected)) ui.selected = null;
  renderPanel(result);
  observeThumbs();
  renderSpot();
  renderDrawer();
  globeUpdate();
}

function toggle(set, value) { set.has(value) ? set.delete(value) : set.add(value); }

function setupControls() {
  $("#days").innerHTML = [1, 2, 3, 4].map(d => `<button type="button" class="pick" data-v="${d}" aria-label="${dayWord(d)}">${d}</button>`).join("");
  $("#month").innerHTML = MONTHS_FULL.map((m, i) => `<option value="${i}">${m}</option>`).join("");
  $("#interests").innerHTML = Object.entries(INTERESTS).map(([k, label]) => `<button type="button" class="chip" data-v="${k}">${label}</button>`).join("");
  $("#modes").innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" class="chip" data-v="${k}">${m.label}</button>`).join("");
  $("#home").value = state.home;

  const changed = () => update();
  $("#home").addEventListener("change", (e) => { state.home = e.target.value; modeChoice.clear(); ui.selected = null; ui.drawer = null; changed(); });
  $("#budget").addEventListener("input", (e) => { state.budget = Number(e.target.value); changed(); });
  $("#month").addEventListener("change", (e) => { state.month = Number(e.target.value); changed(); });
  $("#currency").addEventListener("change", (e) => { state.currency = e.target.value; changed(); });
  // Trip lengths toggle on and off; at least one stays selected.
  $("#days").addEventListener("click", (e) => {
    const b = e.target.closest(".pick");
    if (!b) return;
    const d = Number(b.dataset.v);
    if (state.daysSet.has(d) && state.daysSet.size === 1) return;
    toggle(state.daysSet, d);
    state.days = Math.min(...state.daysSet);
    changed();
  });
  $("#int-more").addEventListener("click", () => {
    const box = document.querySelector(".interests-box"), open = box.classList.toggle("open");
    $("#int-more").setAttribute("aria-expanded", String(open));
    $("#int-more").textContent = open ? "Show fewer" : "+ 8 more interests";
  });
  $("#interests").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) { toggle(state.interests, b.dataset.v); changed(); } });
  $("#modes").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) { toggle(state.modes, b.dataset.v); changed(); } });
  document.querySelector(".sort").addEventListener("click", (e) => { const b = e.target.closest(".pick"); if (b) { state.sort = b.dataset.v; changed(); } });

  // Filters popover and (on phones) the settings toggle
  const pop = $("#filters"), btn = $("#filters-btn");
  btn.addEventListener("click", () => { pop.hidden = !pop.hidden; btn.setAttribute("aria-expanded", String(!pop.hidden)); });
  document.addEventListener("click", (e) => {
    if (!pop.hidden && !pop.contains(e.target) && !btn.contains(e.target)) { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  });
  $("#settings-btn").addEventListener("click", () => {
    const open = document.body.classList.toggle("settings-open");
    $("#settings-btn").setAttribute("aria-expanded", String(open));
  });

  // Trip list: hover highlights the route, click flies there.
  $("#results").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) select(r.dataset.id); });
  $("#results").addEventListener("mouseover", (e) => { const r = e.target.closest(".row"); const id = r ? r.dataset.id : null; if (id !== ui.hover) { ui.hover = id; G.fxDirty = true; } });
  $("#results").addEventListener("mouseleave", () => { ui.hover = null; G.fxDirty = true; });

  // Spotlight card and drawer buttons
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const { act, id, v } = b.dataset;
    if (act === "close-spot") { ui.selected = null; renderSpot(); document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active")); }
    if (act === "open-plan") { ui.drawer = id; renderDrawer(); $("#drawer").scrollTop = 0; }
    if (act === "close-drawer") { ui.drawer = null; renderDrawer(); }
    if (act === "mode") { modeChoice.set(id, v); update(); }
    if (act === "daytrip") { dayTripChoice.set(id, Number(v)); update(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (ui.drawer) { ui.drawer = null; renderDrawer(); }
      else if (!pop.hidden) { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    }
  });
}

document.getElementById("city-count").textContent = CITIES.length;
setupControls();
globeInit();
loadRates();
update();
// Start with the top pick highlighted.
if (current.trips[0]) select(current.trips[0].key, { fly: false });
</script>
</body>
