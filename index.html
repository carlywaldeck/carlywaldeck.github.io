<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
/* Daylight theme (single theme by design). */
:root {
  color-scheme: light;
  --space: #EEF4FB;
  --bg: #FFFFFF;
  --glass: rgba(255, 255, 255, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.96);
  --soft: rgba(19, 35, 63, 0.045);
  --ink: #13233F;
  --muted: #5D6B85;
  --line: rgba(19, 35, 63, 0.10);
  --hover-line: rgba(19, 35, 63, 0.28);
  --accent: #FF6A4D;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(255, 106, 77, 0.11);
  --good: #0B8A7C; --good-soft: rgba(14, 159, 142, 0.12);
  --mid: #B7770A;  --mid-soft: rgba(230, 154, 18, 0.14);
  --warn: #C73558; --warn-soft: rgba(224, 71, 107, 0.12);
  --dot-good: #12A594; --dot-mid: #EFA21C; --dot-warn: #E8527A;
  --s2: #D6E4F7; --s3: #9DBCE6; --s4: #4F82C9;
  --shadow: 0 10px 40px rgba(30, 60, 110, 0.12), 0 1px 3px rgba(30, 60, 110, 0.08);
  --display: "Unbounded", "Geist", system-ui, sans-serif;
  --sans: "Geist", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.eyebrow { font: 500 11px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: var(--shadow); }

/* ---------- Stage ---------- */
#stage { position: fixed; inset: 0; }
#stage canvas { position: absolute; inset: 0; }
#globe-fx { cursor: grab; touch-action: none; }
#globe-fx.grabbing { cursor: grabbing; }
.no-globe #stage::after { content: "The globe couldn't load. Your trips are still listed on the right."; position: absolute; left: 24px; top: 50%; color: var(--muted); max-width: 30ch; }

/* ---------- Top bar ---------- */
.topbar {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px; z-index: 5;
  display: flex; align-items: center; gap: 18px; padding: 10px 12px 10px 18px; border-radius: 16px;
}
.brand { font: 600 17px/1 var(--display); letter-spacing: -0.02em; white-space: nowrap; }
.brand span { color: var(--accent); }
.controls { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.field { display: grid; gap: 3px; }
.field > span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.field > span b { color: var(--ink); font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; margin-left: 4px; }
select {
  appearance: none; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 6px 28px 6px 10px; font-weight: 500;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%; background-size: 4px 4px; background-repeat: no-repeat;
}
select option, select optgroup { background: #FFFFFF; color: var(--ink); }
.field.budget input { width: 150px; accent-color: var(--accent); margin: 6px 0 4px; }
.seg { display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg .pick { border: 0; background: none; width: 32px; padding: 4px 0; border-radius: 7px; font-weight: 500; color: var(--muted); }
.seg .pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.bar-btn { margin-left: auto; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 14px; font-weight: 500; white-space: nowrap; }
.bar-btn:hover, .bar-btn[aria-expanded="true"] { border-color: var(--hover-line); }
.bar-btn i { font-style: normal; font: 500 11px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 6px; margin-left: 6px; }
.bar-btn i:empty { display: none; }
#settings-btn { display: none; }

.popover {
  position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 84px); right: calc(16px + min(400px, 34vw) + 16px);
  width: min(420px, calc(100vw - 32px)); padding: 18px; border-radius: 16px; display: grid; gap: 18px; background: var(--glass-strong);
}
.popover h3 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.chip:hover { border-color: var(--hover-line); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- Trip panel ---------- */
.panel {
  position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 92px); right: 16px; bottom: 16px;
  width: min(400px, 34vw); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;
}
.panel-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.panel-head h2 { font: 600 20px/1.2 var(--display); letter-spacing: -0.02em; }
.panel-head p { margin: 0; font-size: 13px; color: var(--muted); }
.sort { display: flex; gap: 4px; margin-top: 8px; }
.sort .pick { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.sort .pick[aria-pressed="true"] { color: var(--ink); border-color: var(--hover-line); }
.panel-list { overflow-y: auto; padding: 6px 8px 14px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.group { display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.group span { font-family: var(--mono); letter-spacing: 0; }
.row {
  width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  text-align: left; border: 0; background: none; border-radius: 10px; padding: 9px 10px; transition: background .12s;
}
.row:hover, .row.hover { background: var(--soft); }
.row.active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(255, 106, 77, 0.45); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-good); }
.row.mid .dot { background: var(--dot-mid); } .row.warn .dot { background: var(--dot-warn); }
.row-main { min-width: 0; display: grid; }
.row-main strong { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-price { font-size: 14px; }
.row.good, .row.mid, .row.warn { color: var(--ink); }
.row.good .row-price { color: var(--good); } .row.mid .row-price { color: var(--mid); } .row.warn .row-price { color: var(--warn); }
.empty { padding: 16px 10px; color: var(--muted); }

/* ---------- Spotlight card ---------- */
.spot { position: fixed; z-index: 4; left: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); border-radius: 18px; padding: 18px 20px; display: grid; gap: 4px; }
.spot h2 { font: 600 24px/1.15 var(--display); letter-spacing: -0.03em; margin-top: 2px; }
.spot-price { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.spot-price strong { font-size: 30px; font-weight: 500; }
.spot-price span, .spot-meta span { font-size: 13px; }
.good { color: var(--good); } .mid { color: var(--mid); } .warn { color: var(--warn); }
.spot-meta { margin: 0; font-size: 13px; color: var(--muted); }
.cta { margin-top: 12px; border: 0; border-radius: 11px; padding: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cta:hover { filter: brightness(1.05); }
.cta { box-shadow: 0 6px 18px rgba(255, 106, 77, 0.35); }
.x { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
.x:hover { color: var(--ink); }

/* ---------- Map controls ---------- */
.hud { position: fixed; z-index: 3; bottom: 16px; left: 50%; transform: translateX(calc(-50% - min(200px, 17vw))); display: flex; gap: 6px; }
.hud button { border: 1px solid rgba(255,255,255,.7); background: var(--glass); box-shadow: var(--shadow); color: var(--ink); backdrop-filter: blur(12px); border-radius: 10px; min-width: 38px; height: 36px; padding: 0 12px; font-weight: 500; }
.hud button:hover { border-color: var(--hover-line); }
.legend { position: fixed; z-index: 3; left: 16px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.6); backdrop-filter: blur(10px); top: calc(env(safe-area-inset-top, 0px) + 96px); display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.legend i.l { width: 18px; height: 0; border-radius: 0; border-top: 1.5px solid var(--muted); }
.legend i.l.dot { border-top-style: dotted; } .legend i.l.dash { border-top-style: dashed; }

/* ---------- Plan drawer ---------- */
.drawer {
  position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); overflow-y: auto;
  background: var(--glass-strong); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(30, 60, 110, 0.15);
  padding: calc(env(safe-area-inset-top, 0px) + 28px) 28px calc(env(safe-area-inset-bottom, 0px) + 40px);
  animation: slide .35s cubic-bezier(.2, .8, .2, 1);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer .x { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; z-index: 9; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(30,60,110,.18); color: var(--ink); font-size: 20px; }
.dr-head { display: grid; gap: 6px; padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.dr-head h2 { font: 600 34px/1.05 var(--display); letter-spacing: -0.04em; }
.lede { color: var(--muted); margin: -8px 0 24px; }
.stack { display: grid; gap: 34px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.mid { background: var(--mid-soft); color: var(--mid); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.stack h4 { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.costbar { position: relative; display: flex; height: 6px; border-radius: 3px; background: var(--soft); margin: 28px 0 16px; }
.costbar span { height: 100%; }
.costbar span:first-child { border-radius: 3px 0 0 3px; }
.c1 { background: var(--accent); } .c2 { background: #4F82C9; } .c3 { background: #9DBCE6; } .c4 { background: #D6E4F7; } .c5 { background: var(--dot-mid); }
.budget-mark { position: absolute; top: -22px; bottom: -5px; width: 0; border-left: 1.5px solid var(--ink); }
.budget-mark b { position: absolute; top: 0; right: 5px; white-space: nowrap; font: 500 11px/1 var(--mono); color: var(--muted); }
.budget-mark.flip b { right: auto; left: 5px; }
.lines { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.lines li { display: flex; align-items: center; gap: 10px; }
.lines .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lines .amt { margin-left: auto; font: 400 14px var(--mono); }
.lines small { color: var(--muted); }
.lines .total { border-top: 1px solid var(--line); padding-top: 11px; font-weight: 600; }
.options { display: grid; gap: 6px; }
.option { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: #FFFFFF; border-radius: 11px; padding: 11px 14px; }
.option strong { font-weight: 600; }
.option:not(:disabled):hover { border-color: var(--hover-line); }
.option:disabled { cursor: not-allowed; opacity: .4; }
.option span:nth-child(2) { color: var(--muted); font-size: 13px; }
.option[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fine { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.fine a { color: var(--accent); }
.live { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 2px 5px; vertical-align: 2px; }
.chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 90px; }
.chart .bar { border-radius: 3px 3px 0 0; min-height: 6px; }
.bar.good { background: var(--dot-good); } .bar.mid { background: var(--dot-mid); } .bar.warn { background: var(--dot-warn); }
.bar.sel { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.chart-x { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 6px; font: 400 11px/1 var(--mono); color: var(--muted); text-align: center; }
.chart-x .sel { color: var(--ink); }
.chart-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.chart-key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.best { margin: 0 0 16px; color: var(--muted); }
.days, .daytrips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.day, .daytrip { border: 1px solid var(--line); background: #FFFFFF; border-radius: 14px; padding: 16px; }
.trip-day { border-color: rgba(14, 159, 142, .45); }
.day-head, .dt-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 10px; }
.day-head strong, .dt-head strong { font-weight: 600; }
.day-head .num, .dt-head .num { font-size: 13px; color: var(--muted); }
.day ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.day li { display: grid; gap: 2px; }
.day .slot { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .what { display: flex; gap: 8px; justify-content: space-between; line-height: 1.4; }
.day .what span:last-child { font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; }
.day .what.solo span { font: inherit; color: inherit; white-space: normal; }
.daytrip { display: flex; flex-direction: column; gap: 6px; }
.daytrip .dt-head { margin-bottom: 0; }
.daytrip.on { border-color: var(--accent); }
.dt-how { font-size: 12px; color: var(--muted); }
.daytrip p { margin: 0; font-size: 14px; flex: 1; }
.dt-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.dt-tags .tag { font-size: 11px; padding: 2px 8px; }
.dt-tags .tag.hit { background: var(--accent-soft); color: var(--accent); }
.dt-btn { margin-top: 6px; border: 1px solid var(--line); background: none; border-radius: 9px; padding: 8px 10px; font-weight: 500; font-size: 13px; }
.dt-btn:hover { border-color: var(--hover-line); }
.dt-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { text-decoration: none; font-weight: 500; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; }
.links a:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Phones ---------- */
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; gap: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; padding: 10px 12px; }
  .controls { display: none; order: 3; flex-basis: 100%; flex-wrap: wrap; gap: 12px; }
  .settings-open .controls { display: flex; }
  #settings-btn { display: inline-block; margin-left: auto; }
  .bar-btn { padding: 7px 11px; font-size: 14px; }
  #filters-btn { margin-left: 0; }
  .popover { top: auto; bottom: 16px; right: 10px; left: 10px; width: auto; z-index: 9; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 42vh; border-radius: 18px 18px 0 0; border-bottom: 0; }
  .panel-head { padding: 14px 16px 10px; }
  .spot { bottom: calc(42vh + 10px); left: 10px; width: calc(100vw - 20px); padding: 14px 16px; }
  .spot h2 { font-size: 19px; } .spot-price strong { font-size: 24px; }
  .hud, .legend { display: none; }
  .drawer { padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px 40px; }
  .dr-head h2 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
/* ---------- Live data: photos, weather, holidays ---------- */
.thumb { position: relative; width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #DCE8F6, #F7F3EA) center / cover no-repeat; }
.thumb .dot { position: absolute; right: -2px; bottom: -2px; border: 2px solid #fff; width: 11px; height: 11px; }
.spot.with-img { padding-top: 0; overflow: hidden; }
.spot-img { height: 150px; margin: 0 -20px 12px; background: center / cover no-repeat; }
.spot.with-img .x { color: #fff; background: rgba(19,35,63,.45); border-radius: 50%; width: 28px; height: 28px; font-size: 18px; top: 10px; }
.wx-line { color: var(--ink); }
.hero { margin: calc(-1 * (env(safe-area-inset-top, 0px) + 28px)) -28px 22px; position: relative; }
.hero img { display: block; width: 100%; height: 260px; object-fit: cover; }
.hero figcaption { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(19,35,63,.45); padding: 2px 8px; border-radius: 999px; }
.hero figcaption a { color: #fff; }
.local { font-size: 13px; color: var(--muted); }
.about { margin: 0; color: var(--ink); }
.more { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
.wx-summary { margin: 0 0 14px; }
.wx { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.wx-col { display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 8px; }
.wx-col.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(255,106,77,.4); }
.wx-temp { font: 500 11px var(--mono); }
.wx-temp.hot { color: #D2462B; } .wx-temp.warm { color: #C77A0A; } .wx-temp.mild { color: #2F7A4F; } .wx-temp.cool { color: #3D6FB5; } .wx-temp.cold { color: #5B5FC7; }
.wx-bar { height: 56px; width: 8px; background: var(--soft); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.wx-bar i { display: block; width: 100%; background: linear-gradient(to top, #9DBCE6, #FF8A6B); border-radius: 4px; }
.wx-rain { font: 400 11px var(--mono); color: #3D7CC9; }
.wx-m { font: 400 11px var(--mono); color: var(--muted); }
.hols { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hols li { display: flex; gap: 12px; }
.hols .num { color: var(--muted); min-width: 90px; font-size: 13px; }
.sources { font-size: 12px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 14px; }
.sources a { color: var(--muted); }
@media (max-width: 760px) { .hero { margin: calc(-1 * (env(safe-area-inset-top, 0px) + 20px)) -18px 18px; } .hero img { height: 200px; } .spot-img { height: 110px; margin: 0 -16px 10px; } }
/* ---------- Interests box, value label, match line ---------- */
.interests-box { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid rgba(255,106,77,.25); display: grid; gap: 8px; }
.ib-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ib-head h3 { font-size: 13px; font-weight: 600; }
.ib-head span { font-size: 12px; color: var(--muted); }
.interests-box .chips { gap: 5px; }
.interests-box .chip { background: #fff; padding: 4px 10px; font-size: 12.5px; }

<script>
// ======================================================================
// Weekender app logic
// ======================================================================

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const INTERESTS = {
  food: "Food", nightlife: "Nightlife", history: "History", art: "Art & museums",
  architecture: "Architecture", castles: "Castles & palaces", nature: "Nature & parks", hiking: "Hiking",
  beach: "Beach", islands: "Islands & boats", wine: "Wine & beer", cafes: "Cafés",
  markets: "Markets & shopping", music: "Live music", streetart: "Street art", festivals: "Festivals"
};
const MODES = {
  bus:    { label: "Bus",    board: "BUS" },
  train:  { label: "Train",  board: "TRAIN" },
  boat:   { label: "Boat",   board: "BOAT" },
  flight: { label: "Flight", board: "FLY" }
};
const SLOTS = ["Morning", "Afternoon", "Evening"];
const BOARD_ROWS = 5;
const LIST_LIMIT = 10;

// Which landmass each place is on. Buses and trains only run within the same landmass;
// everything else is by plane or boat. Anything not listed is mainland Europe (incl. the UK and Istanbul).
const LAND = {
  marrakech: "morocco", fez: "morocco", tangier: "morocco", agadir: "morocco", essaouira: "morocco",
  tunis: "tunisia", amman: "jordan", tbilisi: "georgia",
  dublin: "ireland", valletta: "malta", palma: "mallorca", ibiza: "ibiza", tenerife: "tenerife",
  laspalmas: "grancanaria", funchal: "madeira", pontadelgada: "azores", palermo: "sicily",
  cagliari: "sardinia", chania: "crete", corfu: "corfu", paphos: "cyprus", reykjavik: "iceland"
};
const landOf = (id) => LAND[id] || "europe";
// Places without useful rail links (buses only overland).
const NO_RAIL = new Set(["athens", "istanbul", "dubrovnik", "agadir", "essaouira", "tirana", "sarajevo", "amman"]);
// Ferry routes between places in the list: round-trip cost (EUR) and hours each way.
// Spain–Tangier fares include the bus to the port at Tarifa.
const FERRIES = {
  "barcelona-palma": { cost: 90, hours: 7 },
  "palma-valencia": { cost: 90, hours: 8 },
  "ibiza-palma": { cost: 80, hours: 2.5 },
  "barcelona-ibiza": { cost: 100, hours: 8 },
  "ibiza-valencia": { cost: 90, hours: 5 },
  "barcelona-rome": { cost: 140, hours: 20 },
  "malaga-tangier": { cost: 80, hours: 4.5 },
  "seville-tangier": { cost: 90, hours: 5.5 },
  "palermo-tunis": { cost: 110, hours: 10 },
  "naples-palermo": { cost: 90, hours: 10.5 },
  "athens-chania": { cost: 80, hours: 9 },
  "bari-corfu": { cost: 110, hours: 9 },
  "bari-dubrovnik": { cost: 110, hours: 10 },
  "laspalmas-tenerife": { cost: 60, hours: 1.5 },
  "stockholm-tallinn": { cost: 80, hours: 16 },
  "riga-stockholm": { cost: 80, hours: 17 },
  "dublin-london": { cost: 100, hours: 8 },
  "dublin-edinburgh": { cost: 90, hours: 9 },
  "dubrovnik-split": { cost: 70, hours: 4.5 }
};
// Where budget airlines actually fly from, when it isn't the obvious city airport.
const BUDGET_AIRPORTS = {
  florence: "Pisa (PSA) or Bologna (BLQ)", venice: "Treviso (TSF) or Marco Polo (VCE)",
  milan: "Bergamo (BGY) or Malpensa (MXP)", paris: "Beauvais (BVA), Orly or CDG",
  brussels: "Charleroi (CRL) or Zaventem", stockholm: "Skavsta (NYO) or Arlanda",
  london: "Stansted, Luton or Gatwick", rome: "Ciampino (CIA) or Fiumicino",
  barcelona: "El Prat or Girona (GRO)", tbilisi: "Kutaisi (KUT) or Tbilisi", tenerife: "Tenerife South (TFS) or North",
  reykjavik: "Keflavík (KEF)", salzburg: "Salzburg or Munich (MUC)", sansebastian: "Biarritz (BIQ) or Bilbao (BIO)",
  essaouira: "Essaouira or Marrakech (RAK)"
};

// ---------------------------------------------------------------- live prices (optional)
// Paste the URL of your price worker here (see docs/LIVE_PRICES.md). Leave it empty to use
// estimates only. Only works when the site is hosted somewhere that allows outside requests,
// such as GitHub Pages.
const LIVE_PRICES_URL = window.WEEKENDER_API || "";
// Your GetYourGuide partner ID, once approved. Links still work without it.
const GYG_PARTNER_ID = "";
const liveFares = new Map(); // "MAD-LIS-2026-10" -> { status: "loading" | "ok" | "none", price, link, depart, ret }

// The next time the chosen month comes around, as YYYY-MM.
function travelMonth() {
  const now = new Date();
  const year = state.month >= now.getMonth() ? now.getFullYear() : now.getFullYear() + 1;
  return `${year}-${String(state.month + 1).padStart(2, "0")}`;
}
const fareKey = (home, dest) => `${home.code}-${dest.code}-${travelMonth()}`;

async function fetchLiveFare(home, dest) {
  const key = fareKey(home, dest);
  if (!LIVE_PRICES_URL || liveFares.has(key)) return;
  liveFares.set(key, { status: "loading" });
  try {
    const res = await fetch(`${LIVE_PRICES_URL.replace(/\/$/, "")}/flights?from=${home.code}&to=${dest.code}&month=${travelMonth()}`);
    const data = res.ok ? await res.json() : {};
    liveFares.set(key, data.price ? { status: "ok", price: data.price, link: data.link, depart: data.departure_at, ret: data.return_at }
                                  : { status: "none" });
  } catch {
    liveFares.set(key, { status: "none" });
  }
  update();
}

// Current choices. The page opens with an example search already filled in.
const state = {
  home: "madrid",
  budget: 300,
  days: 3,
  month: (new Date().getMonth() + 1) % 12,
  interests: new Set(), // none picked: rank by price and timing until you choose
  modes: new Set(Object.keys(MODES)),
  daysSet: new Set([3]), // trip lengths to show (any combination of 1–4)
  sort: "best", // or "cheap"
  currency: "EUR",
  view: "list"  // or "map"
};
const expanded = new Set();       // trips whose plan is open
const modeChoice = new Map();     // city id -> chosen transport mode
const dayTripChoice = new Map();  // city id -> index of chosen day trip (-1 = none)
let showAll = false;

const $ = (sel) => document.querySelector(sel);
const byId = (id) => CITIES.find(c => c.id === id);
const euro = (n) => money(n); // prices are stored in EUR and shown in the chosen currency
const hrs = (h) => h < 1 ? "<1h" : `${Math.round(h * 2) / 2}h`.replace(".5h", "½h");

// ---------------------------------------------------------------- transport

function distanceKm(a, b) {
  const rad = (d) => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}

// Every way to get from home to dest, with a rough round-trip price and hours each way.
function transportOptions(home, dest, month) {
  const km = distanceKm(home, dest);
  const mult = dest.priceMult[month];
  const overWater = landOf(home.id) !== landOf(dest.id);
  const opts = [];
  if (!overWater && km <= 1600) {
    opts.push({ mode: "bus", cost: Math.round(Math.max(18, km * 0.1) * mult), hours: km / 70 + 0.5 });
  }
  if (!overWater && km <= 1400 && !NO_RAIL.has(home.id) && !NO_RAIL.has(dest.id)) {
    opts.push({ mode: "train", cost: Math.round(Math.max(25, km * 0.2) * mult), hours: km / 120 + 0.5 });
  }
  const ferry = FERRIES[[home.id, dest.id].sort().join("-")];
  if (ferry) opts.push({ mode: "boat", cost: Math.round(ferry.cost * mult), hours: ferry.hours });
  if (km >= 250 || overWater) {
    const live = liveFares.get(fareKey(home, dest));
    opts.push(live && live.status === "ok"
      ? { mode: "flight", cost: Math.round(live.price + 25), hours: km / 750 + 3, live }
      : { mode: "flight", cost: Math.round((70 + km * 0.04) * mult + 25), hours: km / 750 + 3 });
  }
  return opts;
}

// Pick the option to use: the traveler's own pick if they made one, otherwise the best
// balance of price and time (each hour on the road counts as €8, both ways).
// Longest sensible trip each way: 3 hours per day of the trip (2½ hours for a day trip).
// Flights always qualify on longer trips, and overnight ferries (up to 20h) do too on
// trips of 3+ days, since you sleep on board.
function tooLong(o) {
  if (state.days === 1) return o.mode === "flight" || o.hours > 2.5;
  if (o.mode === "flight") return false;
  if (o.mode === "boat" && state.days >= 3 && o.hours <= 20) return false;
  return o.hours > state.days * 3;
}

function pickTransport(dest, opts) {
  const allowed = opts.filter(o => state.modes.has(o.mode) && !tooLong(o));
  if (!allowed.length) return null;
  const chosen = allowed.find(o => o.mode === modeChoice.get(dest.id));
  return chosen || allowed.reduce((best, o) => (o.cost + o.hours * 16 < best.cost + best.hours * 16 ? o : best));
}

// ---------------------------------------------------------------- trip cost

function chosenDayTrip(dest) {
  if (state.days === 1) return null;
  const pick = dayTripChoice.has(dest.id) ? dayTripChoice.get(dest.id) : (state.days === 4 ? 0 : -1);
  return pick >= 0 ? dest.dayTrips[pick] : null;
}

function estimateTrip(home, dest) {
  const options = transportOptions(home, dest, state.month);
  const transport = pickTransport(dest, options);
  if (!transport) return null;
  const nights = state.days - 1; // 0 for a day trip
  const lodging = Math.round(nights * dest.costs.hostel * dest.priceMult[state.month]);
  const food = state.days * dest.costs.food;
  const dayTrip = chosenDayTrip(dest);
  // A day trip replaces one day of city sightseeing.
  const local = state.days * (dest.costs.transit + dest.costs.activities) - (dayTrip ? dest.costs.activities : 0);
  const extra = dayTrip ? dayTrip.cost : 0;
  return { dest, options, transport, lodging, food, local, dayTrip, extra, nights,
           total: transport.cost + lodging + food + local + extra };
}

// ---------------------------------------------------------------- nearby escapes
// Cheap trips from the home city to small places nearby: day trips (1 day) and
// weekend escapes (1 night away). Cities in the main list are ranked alongside these.

// "Train + bus, 1h15" -> { mode: "train", hours: 1.25 }
function parseHow(how) {
  const s = how.toLowerCase();
  const mode = /ferry|boat/.test(s) ? "boat" : /train|rail|s-bahn|rer|dart|metro|tram/.test(s) ? "train" : "bus";
  const h = s.match(/(\d+)h(\d+)?/), m = s.match(/(\d+)\s*min/);
  const fromH = h ? Number(h[1]) + (h[2] ? Number(h[2]) / 60 : 0) : null;
  const fromM = m ? Number(m[1]) / 60 : null;
  // Ranges like "40 min–1h15": use whichever time comes first.
  const hours = fromH !== null && fromM !== null ? (h.index < m.index ? fromH : fromM) : (fromH ?? fromM ?? 1);
  return { mode, hours };
}

function nearbyEscapes(home) {
  const dayTrips = home.dayTrips.map((d, i) => ({ ...d, id: `${home.id}-day-${i}`, overnight: false }));
  const firstWords = new Set(home.dayTrips.map(d => d.name.split(/[ &,]/)[0]));
  const weekends = home.weekends.map((w, i) => ({ ...w, id: `${home.id}-wkd-${i}`, overnight: true }));
  if (state.days === 1) {
    // A weekend escape also works as a day trip if it's close and doesn't repeat a day trip.
    return [...dayTrips, ...weekends.filter(w => !firstWords.has(w.name.split(/[ &,]/)[0]))];
  }
  return state.days === 2 ? weekends : [];
}

function estimateEscape(home, esc) {
  const transport = parseHow(esc.how);
  if (!state.modes.has(transport.mode)) return null;
  if (state.days === 1 && transport.hours > 2.5) return null;
  const mult = home.priceMult[state.month];
  const nights = state.days - 1;
  const food = state.days * home.costs.food;
  if (!esc.overnight) {
    // Day-trip prices already include round-trip travel and the main entry fee.
    return { transport, nights, food, travel: esc.cost, sights: 0, stay: 0, total: esc.cost + food };
  }
  const travel = Math.round(esc.travel * mult);
  const stay = Math.round(nights * esc.stay * mult);
  return { transport, nights, food, travel, sights: esc.sights, stay, total: travel + stay + esc.sights + food };
}

// ---------------------------------------------------------------- ranking

// Best match = what you like + how good the month is + budget left over.
// With interests picked, matching them is the biggest factor. Short trips lean more on price.
function rankScore(interest, season, savings) {
  if (!state.interests.size) {
    return state.days <= 2 ? 0.35 * season + 0.65 * savings : 0.55 * season + 0.45 * savings;
  }
  return state.days <= 2
    ? 0.5 * interest + 0.15 * season + 0.35 * savings
    : 0.6 * interest + 0.2 * season + 0.2 * savings;
}

// Run a calculation as if one trip length were selected (most of the trip math depends on it).
function withDays(d, fn) {
  const prev = state.days;
  state.days = d;
  try { return fn(); } finally { state.days = prev; }
}

// All selected trip lengths together. Each trip remembers its length and gets a unique key.
function findTrips() {
  const lengths = [...state.daysSet].sort((a, b) => a - b);
  let home = byId(state.home);
  const fits = [], stretch = [];
  for (const d of lengths) {
    const r = withDays(d, findTripsFor);
    home = r.home;
    const tag = (t) => ({ ...t, days: d, key: `${t.dest.id}@${d}` });
    fits.push(...r.fits.map(tag));
    stretch.push(...r.stretch.map(tag));
  }
  const cmp = state.sort === "cheap" ? (a, b) => a.cost.total - b.cost.total : (a, b) => b.score - a.score;
  return { home, fits: fits.sort(cmp), stretch: stretch.sort(cmp) };
}

function findTripsFor() {
  const home = byId(state.home);
  const wanted = [...state.interests];
  const trips = [];
  CITIES.forEach(dest => {
    if (dest.id === home.id) return;
    const cost = estimateTrip(home, dest);
    if (!cost) return;
    const tripTags = new Set(dest.dayTrips.flatMap(d => d.tags));
    const matched = wanted.filter(i => dest.interests.includes(i));
    const viaDayTrip = wanted.filter(i => !dest.interests.includes(i) && tripTags.has(i));
    const interestScore = wanted.length ? (matched.length + 0.6 * viaDayTrip.length) / wanted.length : 1;
    const seasonScore = dest.season[state.month] / 5;
    const savings = Math.max(0, Math.min(1, 1 - cost.total / state.budget));
    const score = rankScore(interestScore, seasonScore, savings);
    trips.push({ dest, cost, matched, viaDayTrip, score, fitsInterests: !wanted.length || matched.length + viaDayTrip.length > 0 });
  });
  nearbyEscapes(home).forEach(esc => {
    const cost = estimateEscape(home, esc);
    if (!cost) return;
    const dest = { id: esc.id, name: esc.name, country: `Near ${home.name}`, code: home.code, season: home.season, escape: esc };
    const matched = wanted.filter(i => esc.tags.includes(i));
    const interestScore = wanted.length ? (matched.length + 0.25 * (wanted.length - matched.length)) / wanted.length : 1;
    const savings = Math.max(0, Math.min(1, 1 - cost.total / state.budget));
    const score = rankScore(interestScore, home.season[state.month] / 5, savings);
    trips.push({ dest, cost, matched, viaDayTrip: [], score, fitsInterests: !wanted.length || matched.length > 0 });
  });
  trips.sort(state.sort === "cheap" ? (a, b) => a.cost.total - b.cost.total : (a, b) => b.score - a.score);
  return {
    home,
    fits: trips.filter(t => t.cost.total <= state.budget),
    // Plans you've opened stay visible even if changes push them well over budget.
    stretch: trips.filter(t => t.cost.total > state.budget && (t.cost.total <= state.budget * 1.2 || expanded.has(t.dest.id)))
  };
}

// ---------------------------------------------------------------- labels

function season(score) {
  if (score >= 5) return { text: "Great time to go", board: "GREAT TIME", tone: "good" };
  if (score >= 4) return { text: "Good time to go", board: "GOOD TIME", tone: "good" };
  if (score >= 3) return { text: "Decent time to go", board: "DECENT", tone: "mid" };
  return { text: "Off season", board: "OFF SEASON", tone: "warn" };
}

function priceLevel(mult) {
  if (mult <= 0.85) return { text: "cheaper", tone: "good" };
  if (mult >= 1.2) return { text: "pricier", tone: "warn" };
  return { text: "average prices", tone: "mid" };
}

// ---------------------------------------------------------------- tickets

function monthStrip(dest) {
  const best = dest.season.map((q, i) => q === 5 ? MONTHS[i] : null).filter(Boolean);
  return `<div class="strip" aria-hidden="true">${dest.season.map((q, i) =>
    `<i class="q${q}${i === state.month ? " sel" : ""}"></i>`).join("")}</div>
    <div class="strip-label">Best months: ${best.join(", ") || "spring and autumn"}</div>`;
}

function transportSection(dest, cost) {
  const allowed = cost.options.filter(o => state.modes.has(o.mode));
  const hidden = cost.options.length - allowed.length;
  return `<div>
    <h4>Getting there</h4>
    <div class="options" role="radiogroup" aria-label="Transport to ${dest.name}">
      ${allowed.map(o => `<button type="button" class="option" role="radio" data-act="mode" data-id="${dest.id}" data-v="${o.mode}"
          aria-checked="${o.mode === cost.transport.mode}" ${tooLong(o) ? "disabled" : ""}>
          <strong>${MODES[o.mode].label}${o.live ? ' <span class="live">live</span>' : ""}</strong>
          <span>~${hrs(o.hours)} each way${tooLong(o) ? ` · too long for ${state.days === 1 ? "a day trip" : dayWord(state.days)}` : ""}</span>
          <span class="num">${euro(o.cost)}</span>
        </button>`).join("")}
    </div>
    ${liveNote(cost)}
    ${BUDGET_AIRPORTS[state.home] && allowed.some(o => o.mode === "flight") ? `<p class="fine">Flying from ${byId(state.home).name}? Budget airlines usually use ${BUDGET_AIRPORTS[state.home]}.</p>` : ""}
    <p class="fine">Round-trip prices. ${hidden ? `${hidden} more option${hidden > 1 ? "s" : ""} hidden by your travel filter.` : "Pick one to update the total."}</p>
  </div>`;
}

function liveNote(cost) {
  if (!LIVE_PRICES_URL) return "";
  const flight = cost.options.find(o => o.mode === "flight");
  if (!flight) return "";
  if (flight.live) {
    const dates = flight.live.depart ? ` for ${flight.live.depart.slice(5, 10)}${flight.live.ret ? " to " + flight.live.ret.slice(5, 10) : ""}` : "";
    return `<p class="fine">Live fare: cheapest recent round trip found was ${euro(flight.live.price)}${dates}, plus ~€25 for airport transfers.
      ${flight.live.link ? `<a href="${flight.live.link}" target="_blank" rel="noopener">See this fare ↗</a>` : ""}</p>`;
  }
  const status = (liveFares.get(fareKey(byId(state.home), cost.dest)) || {}).status;
  return status === "loading" ? `<p class="fine">Checking live flight prices…</p>`
       : status === "none" ? `<p class="fine">No recent live fare for this route and month, so this is an estimate.</p>` : "";
}

const dayWord = (n) => `${n} day${n === 1 ? "" : "s"}`;

function costSection(cost) {
  const parts = [
    ["c1", `${MODES[cost.transport.mode].label} round trip`, `~${hrs(cost.transport.hours)} each way`, cost.transport.cost],
    ["c2", "Hostel", `${cost.nights} night${cost.nights > 1 ? "s" : ""}`, cost.lodging],
    ["c3", "Food", dayWord(state.days), cost.food],
    ["c4", "Local transport & sights", "", cost.local]
  ].filter(p => p[3] > 0);
  if (cost.dayTrip) parts.push(["c5", `Day trip: ${cost.dayTrip.name}`, "travel + entry", cost.extra]);
  return costBlock(parts, cost.total);
}

function costBlock(parts, total) {
  const cost = { total };
  const scale = Math.max(state.budget, cost.total) * 1.02;
  const mark = state.budget / scale * 100;
  return `
    <div>
      <h4>Where the money goes</h4>
      <div class="costbar" role="img" aria-label="Estimated ${euro(cost.total)} against a ${euro(state.budget)} budget">
        ${parts.map(p => `<span class="${p[0]}" style="width:${p[3] / scale * 100}%"></span>`).join("")}
        <div class="budget-mark${mark < 30 ? " flip" : ""}" style="left:${mark}%"><b>Budget ${euro(state.budget)}</b></div>
      </div>
      <ul class="lines">
        ${parts.map(p => `<li><span class="dot ${p[0]}"></span><span>${p[1]} <small>${p[2]}</small></span><span class="amt">${euro(p[3])}</span></li>`).join("")}
        <li class="total"><span>Estimated total per person</span><span class="amt">${euro(cost.total)}</span></li>
      </ul>
    </div>`;
}

function whenSection(dest) {
  return `
    <div>
      <h4>When to go</h4>
      <p class="best">${dest.bestTime}</p>
      <div class="chart" role="img" aria-label="Month by month: bar height shows how good the month is, color shows prices">
        ${dest.season.map((q, i) => {
          const p = priceLevel(dest.priceMult[i]);
          return `<div class="bar ${p.tone}${i === state.month ? " sel" : ""}" style="height:${q / 5 * 100}%"
            title="${MONTHS_FULL[i]}: ${season(q).text.toLowerCase()}, ${p.text}"></div>`;
        }).join("")}
      </div>
      <div class="chart-x">${MONTHS.map((m, i) => `<span class="${i === state.month ? "sel" : ""}">${m[0]}</span>`).join("")}</div>
      <div class="chart-key">
        <span>Taller = better time to visit</span>
        <span><i style="background:var(--good)"></i>Cheaper</span>

function itinerarySection(dest, cost) {
  const cityDays = cost.dayTrip ? state.days - 1 : Math.min(state.days, 3);
  const days = dest.itinerary.slice(0, cityDays).map((day, d) => {
    const total = day.reduce((sum, [, c]) => sum + c, 0);
    return `<div class="day">
      <div class="day-head"><strong>Day ${d + 1}</strong><span class="num">${total ? euro(total) : "Free"}</span></div>
      <ol>${day.map(([what, c], s) => `<li><span class="slot">${SLOTS[s]}</span>
        <span class="what"><span>${what}</span><span>${c ? euro(c) : "free"}</span></span></li>`).join("")}</ol>
    </div>`;
  });
  if (cost.dayTrip) {
    days.push(`<div class="day trip-day"><div class="day-head"><strong>Day ${cityDays + 1}</strong><span class="num">Day trip</span></div>
      <ol><li><span class="slot">${cost.dayTrip.how}</span><span class="what"><span>${cost.dayTrip.name}: ${cost.dayTrip.note}</span><span>${euro(cost.dayTrip.cost)}</span></span></li></ol></div>`);

function extrasSection(home, dest, cost) {
  const mode = cost.transport.mode;
  const q = encodeURIComponent(`Flights from ${home.name} to ${dest.name}`);
  const book = mode === "flight"
    ? `<a href="https://www.google.com/travel/flights?q=${q}" target="_blank" rel="noopener">Flights ↗</a>`

      ? `<a href="https://www.directferries.com/" target="_blank" rel="noopener">Ferries ↗</a>`
      : `<a href="https://www.omio.com/" target="_blank" rel="noopener">${MODES[mode].label} tickets ↗</a>`;
  const hostels = encodeURIComponent(`hostels in ${dest.name}`);
  return `<div class="two">
    <div><h4>Save money</h4><ul class="tips">${dest.tips.map(t => `<li>${t}</li>`).join("")}</ul></div>
    <div><h4>Check live prices</h4><div class="links">
      ${book}
      <a href="https://www.google.com/search?q=${hostels}" target="_blank" rel="noopener">Hostels ↗</a>
      <a href="https://www.getyourguide.com/s/?q=${encodeURIComponent(dest.name)}${GYG_PARTNER_ID ? `&partner_id=${GYG_PARTNER_ID}` : ""}" target="_blank" rel="noopener">Tours &amp; tickets ↗</a>
    </div></div>
  </div>`;
}

function escapePlan(home, esc, cost) {
  const leg = `${esc.how.split(",")[0]} from ${home.name}, ~${hrs(cost.transport.hours)}`;
  let days;
  if (!esc.overnight) {
    days = [[["Getting there", leg], ["The day", esc.note], ["Evening", `Back in ${home.name}`]]];
  } else if (state.days === 1) {
    days = [[["Getting there", leg], ["The day", esc.days[0]], ["Evening", `Back in ${home.name}`]]];
  } else {
    days = [[["Getting there", leg], ["Explore", esc.days[0]], ["Night", "Stay over nearby"]],
            [["Explore", esc.days[1]], ["Evening", `Back in ${home.name}`]]];
  }
  const cards = days.map((d, i) => `<div class="day">
      <div class="day-head"><strong>${days.length > 1 ? `Day ${i + 1}` : "Your day"}</strong></div>
      <ol>${d.map(([slot, what]) => `<li><span class="slot">${slot}</span><span class="what solo"><span>${what}</span></span></li>`).join("")}</ol>
    </div>`).join("");
  const more = esc.overnight && state.days === 1 ? `<p class="fine">Stay the night to also see: ${esc.days[1]}. Switch to 2 days to price it.</p>` : "";
  return `<div><h4>Your plan</h4><div class="days">${cards}</div>${more}</div>`;
}


// ---------------------------------------------------------------- live data (free, keyless APIs)
// Photos and summaries: Wikipedia REST API. Weather: Open-Meteo historical archive (ERA5).
// Public holidays: Nager.Date. Exchange rates: ECB via Frankfurter, with ExchangeRate-API for
// currencies the ECB doesn't publish. Everything is cached in the browser and optional: if a
// service is unreachable (or blocked, as in some previews), the app keeps its built-in estimates.

const CACHE_KEY = "weekender-live-v1";
let liveCache = {};
try { liveCache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch { liveCache = {}; }
let saveTimer = null;
function saveLiveCache() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(liveCache)); } catch { /* storage full or blocked */ } }, 400);
}
const inflight = new Map();
const failedAt = new Map(); // key -> time of last failure, so a down service isn't retried in a loop
const liveStatus = { ok: 0, failed: 0 };

// Cached value right now (or null), without waiting.
function peek(key) { const hit = liveCache[key]; return hit ? hit.v : null; }

// Fetch once, cache for ttlDays, fall back to a stale copy if the service fails.
function cachedLoad(key, ttlDays, loader) {
  const hit = liveCache[key];
  if (hit && Date.now() - hit.t < ttlDays * 864e5) return Promise.resolve(hit.v);
  if (inflight.has(key)) return inflight.get(key);
  if (Date.now() - (failedAt.get(key) || 0) < 5 * 60e3) return Promise.resolve(hit ? hit.v : null);
  const p = (async () => {
    try {
      const v = await loader();
      liveCache[key] = { t: Date.now(), v };
      saveLiveCache();
      liveStatus.ok++;
      return v;
    } catch {
      liveStatus.failed++;
      failedAt.set(key, Date.now());
      return hit ? hit.v : null;
    } finally {
      inflight.delete(key);
      scheduleLiveRender();
    }
  })();
  inflight.set(key, p);
  return p;
}

async function getJSON(url, { allowEmpty = false } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (allowEmpty && (r.status === 204 || r.status === 404)) return null;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

let liveRenderQueued = false;
function scheduleLiveRender() {
  if (liveRenderQueued) return;
  liveRenderQueued = true;
  requestAnimationFrame(() => { liveRenderQueued = false; renderLive(); });
}

function wikiInfo(name) {
  const title = wikiTitle(name);
  const key = "wiki:" + title;
  const now = peek(key);
  if (!liveCache[key] || Date.now() - liveCache[key].t > 30 * 864e5) {
    cachedLoad(key, 30, async () => {
      const d = await getJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`);
      if (!d || d.type === "disambiguation") return { none: true };
      const thumb = d.thumbnail && d.thumbnail.source;
      const file = thumb ? decodeURIComponent((thumb.split("/thumb/")[1] || "").split("/")[2] || "") : "";
      return {
        title: d.title,
        extract: d.extract || "",
        thumb,
        page: d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page,
        file
      };
    });
  }
  return now && !now.none ? now : null;
}

// ---- Open-Meteo: typical weather by month (averages of 2019–2024 daily records)

function placeLatLon(t) {
  if (t.dest.escape) { const p = (PLACES[t.dest.name] || [])[0]; return p ? { lat: p[0], lon: p[1] } : null; }
  const c = byId(t.dest.id);
  return c ? { lat: c.lat, lon: c.lon } : null;
}

function climateAt(lat, lon) {
  const key = `clim:${lat.toFixed(2)},${lon.toFixed(2)}`;
  if (!liveCache[key]) {
    cachedLoad(key, 180, async () => {
      const d = await getJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}` +
        `&start_date=2019-01-01&end_date=2024-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunshine_duration&timezone=auto`);
      const days = d.daily, sums = Array.from({ length: 12 }, () => ({ n: 0, hi: 0, lo: 0, wet: 0, sun: 0 }));
      days.time.forEach((date, i) => {
        const m = Number(date.slice(5, 7)) - 1, s = sums[m];
        if (days.temperature_2m_max[i] == null) return;
        s.n++; s.hi += days.temperature_2m_max[i]; s.lo += days.temperature_2m_min[i];
        if ((days.precipitation_sum[i] || 0) >= 1) s.wet++;
        s.sun += (days.sunshine_duration[i] || 0) / 3600;
      });
      const years = 6;
      return {
        hi: sums.map(s => Math.round(s.hi / s.n)), lo: sums.map(s => Math.round(s.lo / s.n)),
        wet: sums.map(s => Math.round(s.wet / years)), sun: sums.map(s => Math.round(s.sun / s.n * 10) / 10)
      };
    });
  }
  return peek(key);
}

function tripClimate(t) { const p = placeLatLon(t); return p ? climateAt(p.lat, p.lon) : null; }

const CURRENCIES = { EUR: "€", USD: "$", GBP: "£" };
const LOCAL_CURRENCY = {

  "Albania": "ALL", "Bosnia & Herzegovina": "BAM", "Iceland": "ISK"
};
// Approximate fallback rates (EUR -> X), used only until live rates load.
let rates = { EUR: 1, USD: 1.16, GBP: 0.86, CZK: 24.5, HUF: 395, PLN: 4.27, SEK: 11, DKK: 7.46, CHF: 0.94, TRY: 47, RON: 5.08,
  RSD: 117, MAD: 10.6, TND: 3.4, JOD: 0.82, GEL: 3.15, ALL: 97, BAM: 1.956, ISK: 143 };
let ratesLive = null; // { date, source } once live rates arrive

function loadRates() {
  const v = peek("rates");
  if (v) applyRates(v);
  cachedLoad("rates", 0.5, async () => {
    const out = {}; const sources = []; let date = null;
    try { const f = await getJSON("https://api.frankfurter.dev/v1/latest?base=EUR"); Object.assign(out, f.rates); date = f.date; sources.push("ECB via Frankfurter"); } catch { /* try the other source */ }
    try {
      const e = await getJSON("https://open.er-api.com/v6/latest/EUR");
      if (e && e.rates) { for (const [k, r] of Object.entries(e.rates)) if (!(k in out)) out[k] = r; sources.push("ExchangeRate-API"); date = date || (e.time_last_update_utc || "").slice(5, 16); }
    } catch { /* keep what we have */ }
    if (!Object.keys(out).length) throw new Error("no rates");
    return { rates: out, date, sources };
  }).then(v2 => { if (v2) { applyRates(v2); update(); } });
}
function applyRates(v) { rates = { ...rates, ...v.rates, EUR: 1 }; ratesLive = { date: v.date, source: v.sources.join(" + ") }; }

function money(eur, cur = state.currency) {
  const v = eur * (rates[cur] || 1);
  const sym = CURRENCIES[cur];
  return sym ? sym + Math.round(v).toLocaleString("en-US") : `${Math.round(v).toLocaleString("en-US")} ${cur}`;
}

function renderLive() {
  // Update row thumbnails in place, and the open card/drawer.
  document.querySelectorAll(".row .thumb[data-wiki]").forEach(el => {

let thumbObserver = null;
function observeThumbs() {
  const els = document.querySelectorAll(".row .thumb[data-wiki]");
  if (!("IntersectionObserver" in window)) { els.forEach(el => wikiInfo(el.dataset.wiki)); renderLive(); return; }
  if (!thumbObserver) {
    thumbObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { wikiInfo(e.target.dataset.wiki); thumbObserver.unobserve(e.target); } });
      renderLive();
    }, { root: $("#results"), rootMargin: "200px" });
  }
  els.forEach(el => thumbObserver.observe(el));
  renderLive();
}

const toF = (c) => Math.round(c * 9 / 5 + 32);

function weatherLine(t) {
  const c = tripClimate(t);
  if (!c) return "";
  const m = state.month;
  return `${toF(c.hi[m])}°F / ${toF(c.lo[m])}°F · ${c.wet[m]} rainy day${c.wet[m] === 1 ? "" : "s"} in ${MONTHS[m]}`;
}

function weatherSection(t) {
  const c = tripClimate(t);
  if (!c) {
    return `<div><h4>Typical weather</h4><p class="fine">${inflight.size ? "Loading weather records…" : "Weather records aren't available right now; see the month guide below."}</p></div>`;
  }
  const m = state.month, maxHi = Math.max(...c.hi), minLo = Math.min(...c.lo);
  const warm = (v) => v >= 28 ? "hot" : v >= 22 ? "warm" : v >= 15 ? "mild" : v >= 8 ? "cool" : "cold";
  return `<div>
    <h4>Typical weather</h4>
    <p class="wx-summary"><strong>${MONTHS_FULL[m]}:</strong> highs around ${toF(c.hi[m])}°F, lows ${toF(c.lo[m])}°F,
      ${c.wet[m]} rainy day${c.wet[m] === 1 ? "" : "s"} and about ${c.sun[m]} hours of sun a day.</p>
    <div class="wx" role="img" aria-label="Average high temperature and rainy days for each month">
      ${c.hi.map((hi, i) => `<div class="wx-col${i === m ? " sel" : ""}" title="${MONTHS_FULL[i]}: ${toF(hi)}°F / ${toF(c.lo[i])}°F, ${c.wet[i]} rainy days, ${c.sun[i]}h sun">
        <span class="wx-temp ${warm(hi)}">${toF(hi)}°</span>
        <span class="wx-bar"><i style="height:${Math.round((hi - minLo) / Math.max(1, maxHi - minLo) * 100)}%"></i></span>
        <span class="wx-rain">${c.wet[i]}</span>
        <span class="wx-m">${MONTHS[i][0]}</span>
      </div>`).join("")}
    </div>
    <p class="fine">Top: average daily high (°F). Bottom row: rainy days (0.04 in+ of rain). Averages of 2019–2024 weather records.</p>
  </div>`;
}

function holidaySection(t) {
  const country = tripCountry(t);
  const [year] = travelMonth().split("-").map(Number);
  const list = holidaysIn(country, year);
  if (list === null) return COUNTRY_CODES[country] && inflight.size ? `<div><h4>Public holidays</h4><p class="fine">Checking holidays…</p></div>` : "";
  const inMonth = list.filter(h => Number(h.date.slice(5, 7)) - 1 === state.month);
  const fmt = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", weekday: "short" });
  return `<div><h4>Public holidays in ${MONTHS_FULL[state.month]} ${year}</h4>
    ${inMonth.length
      ? `<ul class="hols">${inMonth.map(h => `<li><span class="num">${fmt(h.date)}</span>${h.name}</li>`).join("")}</ul>
         <p class="fine">Expect bigger crowds, higher prices and some closures around these dates, especially long weekends.</p>`
      : `<p class="fine">No national public holidays in ${country} that month, so no holiday crowds.</p>`}
  </div>`;
}

function localCurrencyNote(t) {
  const code = LOCAL_CURRENCY[tripCountry(t)] || "EUR";
  if (code === state.currency) return "";
  return `<span class="local">≈ ${money(t.cost.total, code)} in local money</span>`;
}

function sourcesNote() {
  const offline = liveStatus.ok === 0 && liveStatus.failed > 0 && !Object.keys(liveCache).length;
  return `<p class="sources">${offline
    ? "Photos, weather records, holidays and live exchange rates couldn't load here (this preview blocks outside services). They load on the published site."
    : `Sources: photos and summaries from <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> / Wikimedia Commons ·
       weather from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (ERA5, CC BY 4.0) ·
       holidays from <a href="https://date.nager.at" target="_blank" rel="noopener">Nager.Date</a> ·
       exchange rates ${ratesLive ? `from ${ratesLive.source}${ratesLive.date ? ` (${ratesLive.date})` : ""}` : "approximate"} (<a href="https://www.frankfurter.app" target="_blank" rel="noopener">Frankfurter</a>, <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by Exchange Rate API</a>).`}</p>`;
}

// ---------------------------------------------------------------- escape plan details

function escapeDetails(home, dest, cost) {
  const esc = dest.escape;
  const parts = [
    ["c1", esc.overnight ? `${MODES[cost.transport.mode].label} round trip` : "Travel + entry", `~${hrs(cost.transport.hours)} each way`, cost.travel],
    ["c2", "Stay", `${cost.nights} night`, cost.stay],
    ["c3", "Food", dayWord(state.days), cost.food],
    ["c4", "Sights & entry", "", cost.sights]
  ].filter(p => p[3] > 0);
  const mode = cost.transport.mode;
  const book = mode === "boat"
    ? `<a href="https://www.directferries.com/" target="_blank" rel="noopener">Ferries ↗</a>`
    : `<a href="https://www.omio.com/" target="_blank" rel="noopener">${MODES[mode].label} tickets ↗</a>`;
  return `
    ${costBlock(parts, cost.total)}
    ${escapePlan(home, esc, cost)}
    <div><h4>Save money</h4><ul class="tips">
      <li>Regional trains and buses usually have fixed fares, so you rarely need to book ahead.</li>
      <li>Leave early: you get a full day there, and the first departures are often the quietest.</li>
      ${cost.stay ? "<li>Small towns empty out after the day-trippers leave, and guesthouses there are often cheaper than city hostels.</li>" : ""}
    </ul></div>
    <div><h4>Check live prices</h4><div class="links">
      ${book}
      ${cost.stay ? `<a href="https://www.google.com/search?q=${encodeURIComponent("cheap places to stay " + dest.name)}" target="_blank" rel="noopener">Places to stay ↗</a>` : ""}
      <a href="https://www.getyourguide.com/s/?q=${encodeURIComponent(dest.name.split(/ [&(]/)[0])}${GYG_PARTNER_ID ? `&partner_id=${GYG_PARTNER_ID}` : ""}" target="_blank" rel="noopener">Tours &amp; tickets ↗</a>
    </div></div>`;
}

// ---------------------------------------------------------------- trip helpers

const isEscape = (t) => !!t.dest.escape;
const tripKind = (t) => isEscape(t) ? (t.dest.escape.overnight && t.days === 2 ? "Weekend escape" : "Day trip") : t.dest.country;
const daysLabel = () => { const l = [...state.daysSet].sort((a, b) => a - b); return l.length === 1 ? dayWord(l[0]) : `${l.join(", ")} days`; };

// Color = overall value: half price (vs your budget), half how good the month is to go.
function valueScore(t) {
  const s = ((t.dest.season || current.home.season)[state.month] - 1) / 4;
  const p = t.cost.total <= state.budget ? 1 - 0.6 * (t.cost.total / state.budget) : 0;
  return 0.5 * p + 0.5 * s;
}
const tone = (t) => t.over ? "warn" : valueScore(t) >= 0.72 ? "good" : valueScore(t) >= 0.5 ? "mid" : "warn";
const TONE_TEXT = { good: "Great value: good price and a good time to go", mid: "Okay value", warn: "Pricey for your budget or off-season" };

// Display order: for each trip length, nearby escapes first (1–2 days) then cities; trips that
// don't match your interests come after all the matches; a little over budget comes last.
function orderedTrips({ fits, stretch }) {
  const lengths = [...state.daysSet].sort((a, b) => a - b);
  const arrange = (list, d) => d <= 2 ? [...list.filter(isEscape), ...list.filter(t => !isEscape(t))] : list;
  const main = [], others = [];
  for (const d of lengths) {
    const ofLen = fits.filter(t => t.days === d);
    main.push(...arrange(ofLen.filter(t => t.fitsInterests), d));
    others.push(...arrange(ofLen.filter(t => !t.fitsInterests), d));
  }
  return [...main.map(t => ({ ...t, over: false })), ...others.map(t => ({ ...t, over: false, other: true })),
          ...stretch.map(t => ({ ...t, over: true }))];
}

// [lon, lat] points for a trip: a city, or the stops of an escape.
function tripPoints(t) {
  if (isEscape(t)) return (PLACES[t.dest.name] || []).map(([lat, lon]) => [lon, lat]);
  const c = byId(t.dest.id);
  return c ? [[c.lon, c.lat]] : [];
}

// ---------------------------------------------------------------- panel (trip list)

let current = { home: null, trips: [] };
const ui = { selected: null, hover: null, drawer: null };

function renderPanel(result) {
  const { home, fits } = result;
  const trips = current.trips;
  const n = fits.length;
  const multi = state.daysSet.size > 1;
  $("#results-title").textContent = n ? `${n} trip${n === 1 ? "" : "s"} fit` : "Nothing fits yet";
  $("#results-sub").textContent = `From ${home.name} · ${daysLabel()} · ${MONTHS_FULL[state.month]} · ${euro(state.budget)}`;
  if (!state.modes.size) {
    $("#results").innerHTML = `<p class="empty">Pick at least one way to travel under Transport.</p>`;
    return;
  }
  if (!trips.length) {
    $("#results").innerHTML = `<p class="empty">Nothing fits ${euro(state.budget)} for ${daysLabel()} in ${MONTHS_FULL[state.month]}. Try another trip length, another month, or a bigger budget.</p>`;
    return;
  }
  const groups = [];
  const main = trips.filter(t => !t.over && !t.other);
  for (const d of [...state.daysSet].sort((a, b) => a - b)) {
    const pre = multi ? `${dayWord(d)} · ` : "";
    const near = main.filter(t => t.days === d && isEscape(t));
    const far = main.filter(t => t.days === d && !isEscape(t));
    if (near.length) groups.push([`${pre}${d === 1 ? "Day trips" : "Weekend escapes"} near ${home.name}`, near]);
    if (far.length) groups.push([`${pre}${near.length ? (d === 1 ? "Cities you can do in a day" : "Cities within reach") : "Cities"}`, far]);
  }
  const other = trips.filter(t => t.other), over = trips.filter(t => t.over);
  if (other.length) groups.push(["Also fits, but doesn't match your interests", other]);
  if (over.length) groups.push(["A little over budget", over]);
  $("#results").innerHTML = groups.map(([title, list]) => `
    <h3 class="group">${title}<span>${list.length}</span></h3>
    ${list.map(t => {
      const likes = [...(t.matched || []), ...(t.viaDayTrip || [])].map(m => INTERESTS[m]);
      return `<button type="button" class="row ${tone(t)}${ui.selected === t.key ? " active" : ""}" data-id="${t.key}" title="${TONE_TEXT[tone(t)]}">
        <span class="thumb" data-wiki="${t.dest.name.replace(/"/g, "&quot;")}"><i class="dot"></i></span>
        <span class="row-main"><strong>${t.dest.name}</strong>
          <small>${multi ? `${dayWord(t.days)} · ` : ""}${tripKind(t)} · ${MODES[t.cost.transport.mode].label} ${hrs(t.cost.transport.hours)}</small>
          ${state.interests.size && likes.length ? `<small class="match">✓ ${likes.join(" · ")}</small>` : ""}</span>
        <span class="row-price num">${euro(t.cost.total)}</span>
      </button>`;
    }).join("")}`).join("");
}

function select(id, { fly = true } = {}) {
